# Mobile SuperApp Kit — Structural Constraints
#
# STATUS: machine enforcement intentionally DISABLED (documentation-only file).
# `cfs validate` structure checks (headings / ToC / numbering / identifier
# allowlists) only run for artifact kinds declared in this file, and for this
# brownfield corpus every declaration mode fails (verified empirically on
# cfs 1.5.9, engine skill cache, 2026-08-03):
#
#   1. Any kind block with an EMPTY `identifiers` table still triggers the
#      unconditional identifier-validation phase with an empty allowlist:
#      every `**ID**:` definition in the corpus errors with
#      "uses kind `<k>` not allowed (allowed: [])" — 314 errors.
#
#   2. Any NON-EMPTY `identifiers` table makes each declared kind a KIT-WIDE
#      ID token. The engine then runs autodetect slug-consistency checks
#      requiring every definition ID to parse as
#      cpt-{parent-prefix}-{system}-{kind}-{rest}. Simulating the exact engine
#      algorithm over the full token enumeration yields 19 unfixable errors,
#      because the ~433-ID corpus predates that scheme and is heterogeneous:
#        - miniapp docs use `cpt-student-*` (no `superapp-` parent prefix),
#        - auth epic mixes `cpt-superapp-*` and `cpt-superapp-auth-*`,
#        - feature-flags IDs contain multiple/zero token markers (ambiguous).
#      Many algo/dod/flow/state IDs are pinned in source code via
#      @cpt-begin/@cpt-end markers across ~50 files and MUST NOT be renamed.
#
# Re-enable enforcement only after either (a) the engine gains a per-kind
# switch to skip identifier validation, or (b) the corpus IDs are migrated to
# one consistent hierarchical scheme (a breaking, code-touching migration).
#
# ── ID taxonomy (documentation only, NOT enforced) ─────────────────────────
# Target scheme, used by every template in this kit as of v1.3.0:
#   cpt-{hierarchy-prefix}-{kind}-{slug}
# where hierarchy-prefix accumulates down the layers:
#   platform: superapp                  e.g. cpt-superapp-fr-analytics-telemetry
#   miniapp:  superapp-student          e.g. cpt-superapp-student-fr-course-list
#   epic:     superapp-student-home     e.g. cpt-superapp-student-home-fr-greeting
# Cross-layer references use the defining layer's prefix, e.g. actors are always
# cpt-superapp-actor-{slug} and kernel contracts cpt-superapp-contract-{slug}.
# Feature IDs: cpt-{hierarchy-prefix}-{algo|dod|flow|state|featstatus}-{feature}-{slug}
# Impl markers: @cpt-{kind}:{cpt-id}:p{N} scope markers and paired
#   @cpt-begin:{cpt-id}:p{N}:inst-{local} / @cpt-end:... block markers in FULL
#   mode; @cpt-impl {cpt-id} in DOCS-ONLY mode.
# See guides/TAXONOMY.md for the full naming conventions.
# NOTE: the legacy corpus under architecture/ still uses cpt-{miniapp}-* forms;
# migrating it is the breaking, code-touching migration referenced above.
#
# ── Heading contracts (documentation only, NOT enforced) ───────────────────
# Verified against artifacts/<KIND>/template.md after the kit v1.3.0 alignment
# with the sdlc kit. Every artifact carries `## Table of Contents` followed by
# the `<!-- generated by \`cfs toc\` -->` marker, then numbered H2 sections in
# the order below. Kit authors and review agents keep new artifacts aligned
# with these outlines; the legacy corpus under architecture/ predates them.
#
# PRD-PLATFORM / PRD-MINIAPP / PRD-EPIC share the sdlc PRD outline (H1, then H2):
#   1. Overview | 2. Actors | 3. Operational Concept & Environment | 4. Scope |
#   5. Functional Requirements | 6. Non-Functional Requirements |
#   7. Public {Platform|MiniApp|Epic} Interfaces | 8. Use Cases |
#   9. Acceptance Criteria | 10. Dependencies | 11. Assumptions | 12. Risks |
#   then the layer tail:
#     PRD-PLATFORM: 13. MiniApp Map
#     PRD-MINIAPP:  13. Traceability Matrix
#     PRD-EPIC:     13. UI/UX Requirements | 14. Data Requirements |
#                   15. Traceability Matrix
#   then Appendix: ID Reference
#   Section 1 carries the Glossary subsection; section 5 carries FR entries.
#
# DESIGN-* share the sdlc DESIGN outline (H1, then H2):
#   1. Architecture Overview | 2. Principles & Constraints |
#   3. Technical Architecture | then layer-specific middle sections |
#   Additional Context | Traceability
#     DESIGN-PLATFORM: 4. Cross-Platform Strategy | 5. MiniApp Platform Model
#     DESIGN-MINIAPP:  4. Navigation Architecture | 5. State Management
#     DESIGN-EPIC:     4. State Management | 5. Navigation |
#                      6. Platform-Specific Considerations |
#                      7. Error Handling & Offline
#
# DECOMPOSITION-* share the sdlc DECOMPOSITION outline (H1, then H2):
#   1. Overview | 2. Entries | 3. {Entry|Feature} Dependencies |
#   4./5. Coverage Matrix | then the layer tail:
#     DECOMPOSITION-PLATFORM: 4. Shared Kernel Coverage | 5. Coverage Matrix |
#                             6. Release Roadmap
#     DECOMPOSITION-MINIAPP:  4. Coverage Matrix | 5. Implementation Order
#     DECOMPOSITION-EPIC:     4. Coverage Matrix | 5. Implementation Order |
#                             6. Acceptance Criteria Summary
#
# FEATURE-MOBILE (H1 + status anchor, then H2) — sdlc FEATURE outline:
#   1. Feature Context | 2. Actor Flows (CDSL) |
#   3. Processes / Business Logic (CDSL) | 4. States (CDSL) |
#   5. Definitions of Done | 6. Acceptance Criteria | 7. Traceability
#   Section 3 subsections allocate each process to one target
#   (KMP shared, Android, iOS, WebView bridge).
#
# IMPL-KMP / IMPL-ANDROID / IMPL-IOS (H1, then H2):
#   1. Overview | 2. Scope | 3. Implementation Notes | 4. Traceability Table |
#   5. Directory Structure | 6. Code Markers |
#   [IMPL-IOS only: 7. KMP Integration] | Dependencies | Validation
